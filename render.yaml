services:
  - type: web
    name: voice-ai
    env: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNC
        value: true
      - key: REALTIME_PROVIDER
        value: gemini
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_REALTIME_BASE_URL
        value: https://api.openai.com/v1/realtime/calls
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: MEMORY_EXTRACT_MODEL
        value: gpt-5.4-nano
      - key: MEMORY_EXTRACT_PROVIDER
        value: gemini
      - key: GEMINI_MEMORY_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_LIVE_VOICE
        value: Kore
      - key: GEMINI_LIVE_TEMPERATURE
        value: 0.7
      - key: GEMINI_LIVE_THINKING_LEVEL
        value: low
      - key: GEMINI_VAD_SILENCE_MS
        value: 500
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MEMORY_ENCRYPTION_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
