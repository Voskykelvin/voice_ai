<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira Voice</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="is-idle">
  <div class="ambientCanvas" aria-hidden="true"></div>
  <main class="shell">
    <section class="console">
      <header class="topbar">
        <div class="brandLockup">
          <span class="brandMark" aria-hidden="true">
            <span></span>
          </span>
          <div>
            <p class="eyebrow">Private Voice Engine</p>
            <h1>Mira Voice</h1>
          </div>
        </div>
        <div class="statusGroup">
          <span id="connectionStatus" class="status idle">Idle</span>
          <span id="providerStatus" class="status">openai</span>
        </div>
      </header>

      <section class="voiceStage" aria-label="Voice presence">
        <img class="portraitImage" src="/assets/mira-portrait-hero.png" alt="">
        <div class="portraitVeil" aria-hidden="true"></div>

        <div class="stageCopy">
          <p class="eyebrow">Realtime Companion</p>
          <h2 id="stageState">Standby</h2>
        </div>

        <div id="visualizer" class="visualizer" aria-hidden="true">
          <div class="miraOrb">
            <div class="rotor rotorOne"></div>
            <div class="rotor rotorTwo"></div>
            <div class="rotor rotorThree"></div>
            <div class="orbGlow"></div>
            <span class="miraName">Mira</span>
          </div>
          <div class="waveform" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <section id="transcript" class="transcript" aria-live="polite"></section>
      </section>

      <section class="controls" aria-label="Voice controls">
        <label>
          <span>Name</span>
          <input id="displayName" type="text" autocomplete="name" placeholder="Kelvin">
        </label>
        <label>
          <span>Location</span>
          <input id="location" type="text" autocomplete="address-level2" placeholder="Nairobi, Kenya">
        </label>
        <label>
          <span>User</span>
          <input id="userId" type="text" autocomplete="off">
        </label>
        <label>
          <span>Provider</span>
          <select id="provider">
            <option value="openai">OpenAI Realtime</option>
            <option value="gemini">Gemini Live</option>
          </select>
        </label>
        <button id="startButton" class="primaryAction" type="button">Start</button>
        <button id="stopButton" class="quietAction" type="button" disabled>Stop</button>
      </section>

      <section class="forgetBar">
        <input id="forgetText" type="text" placeholder="Memory text to forget">
        <button id="forgetButton" class="quietAction" type="button">Forget</button>
      </section>
    </section>

    <aside class="side">
      <section>
        <div class="panelHeader">
          <h2>Memories</h2>
          <button id="refreshMemoryButton" type="button">Refresh</button>
        </div>
        <div id="memoryList" class="memoryList"></div>
      </section>

    </aside>
  </main>

  <section id="debugDrawer" class="debugDrawer" aria-label="Debug panel">
    <button id="toggleDebugButton" class="debugToggle" type="button" aria-expanded="false" aria-controls="debugPanel">
      Debug
    </button>
    <div class="debugDrawerPanel">
      <div class="panelHeader">
        <h2>Debug</h2>
        <button id="clearDebugButton" type="button">Clear</button>
      </div>
      <pre id="debugPanel" class="debugPanel"></pre>
    </div>
  </section>

  <audio id="remoteAudio" autoplay></audio>
  <script src="/app.js"></script>
</body>
</html>
